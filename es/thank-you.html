<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solicitud enviada | AdamRodWebDev</title>
  <meta name="description" content="Tu solicitud se ha enviado.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem('arwd-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page { min-height: 100svh; display: grid; align-content: center; padding-block: 96px; }
    .page h1 { font-size: var(--step-3); text-transform: uppercase; margin-bottom: 20px; }
    .page h2 { font-size: var(--step-1); text-transform: uppercase; margin: 32px 0 8px; color: var(--gold); }
    .page p { color: var(--muted); max-width: 65ch; }
    .page .btn { margin-top: 32px; width: fit-content; }
    .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(6rem, 25vw, 14rem); line-height: .9; color: transparent; -webkit-text-stroke: 2px var(--gold); animation: glitch .6s steps(2) 3; }
  </style>
</head>
<body>
  <main class="container page">
    <h1>Solicitud enviada</h1>
    <p>Gracias por tu mensaje. Te respondo en 2 días laborables.</p>
    <a class="btn btn--gold" href="/es/"><span>Volver al inicio</span></a>
  </main>
</body>
</html>
