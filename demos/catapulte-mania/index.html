che. Visez la paille, puis tirez.`,power_volley:`Trois projectiles partent en éventail : idéal contre le verre. Tirez.`,power_powder:`Votre projectile explosera à l’impact, comme une bombe. Visez la salle de fer, puis tirez.`,power_quake:`Le sol tremble sous tout le château.`},done:{ammo_fire:`Le feu se propage tout seul, et une cible qui s’enflamme est éliminée. À vous de jouer !`,ammo_boulder:`Gardez le rocher pour la pierre : sur le bois, une simple pierre suffit souvent.`,ammo_bomb:`Une explosion fait aussi sauter les barils voisins. Le fer ne cède qu’aux explosifs.`,ammo_split:`Plus vous divisez tôt, plus la mitraille s’étale.`,power_calm:`Gardez l’Accalmie pour les tirs précis par grand vent.`,power_titan:`La Force du Titan change une pierre en bélier.`,power_greekfire:`Avec la paille et le bois, l’incendie fait le reste.`,power_volley:`Trois chances de toucher : parfait contre des cibles dispersées.`,power_powder:`La Charge de poudre ouvre ce que la pierre ne perce pas.`,power_quake:`Le Séisme secoue tout le château sans compter comme un tir.`}},characters:{ysolde:{name:`Princesse Ysolde`,role:`Héritière du royaume`},aubert:{name:`Le roi Aubert`,role:`Roi captif`},gontran:{name:`Maître Gontran`,role:`Ingénieur royal`},mordrac:{name:`Le duc Mordrac`,role:`L’usurpateur`}},story:{skip:`Passer`,next:`Suite`,previous:`Page précédente`,close:`Continuer`,page:`Page {n} sur {total}`,chronicle:`La Chronique`,chronicleIntro:`Relisez les épisodes déjà découverts.`,readEpilogue:`Lire l’épilogue`,prologue:{title:`Le maître d’engins`,p1:`An de grâce 1214. Par une nuit sans lune, le duc Mordrac a forcé les portes de la capitale. Trahi par sa garde, le vieux roi Aubert a été enfermé au sommet de sa propre tour.`,p2:`« Mon père est vivant, je le sais. Je ne laisserai pas cet usurpateur porter sa couronne. Qui me suivra ? »`,p3:`« Moi, Altesse, et ma vieille catapulte. Mes yeux ne visent plus aussi bien qu’avant… mais j’ai formé un apprenti. »`,p4:`« À toi de jouer, apprenti. Les premiers forts de Mordrac ne sont que bois et paille. Règle ton tir : je t’apprendrai le reste en chemin. »`},ch2:{title:`Le temps de la pierre`,p1:`« Une princesse, un vieillard et une machine de bois ? Mes forts de pierre vous attendent. Mes chevaliers aussi. »`,p2:`« De la pierre, hein ? J’ai taillé des rochers qui la feront trembler. Garde-les pour les murs, apprenti. »`},ch3:{title:`La poudre noire`,p1:`« Regarde ce que j’ai mis au point cet hiver : de la poudre noire. Même le fer ne lui résiste pas. »`,p2:`« Les forteresses de l’est gardent les barils de Mordrac. Une étincelle au bon endroit, et c’est tout son arsenal qui saute. »`},ch4:{title:`Les citadelles`,p1:`« Ma fille, ne venez pas me chercher. Mordrac a fortifié chaque roc entre nous. Sauvez le royaume, pas un vieil homme. »`,p2:`« Il me demande de renoncer ? Il me connaît bien mal. Sur ces rocs, il faudra tirer en cloche. En avant ! »`},ch5:{title:`La traversée des marais`,p1:`« Tu as pris mes citadelles ? Soit. Que les marais vous engloutissent tous les trois. »`,p2:`« Des maisons de brique sur pilotis… Un seul pied pourri et tout plonge dans la vase. Vise les points faibles. »`},ch6:{title:`Les terres brûlées`,p1:`« Les mercenaires du duc tiennent le désert. Leurs forts de grès s’effritent au soleil… et notre eau s’épuise. »`,p2:`« Alors chaque tir doit compter. Pas de gaspillage, apprenti. »`},ch7:{title:`Les nids d’aigle`,p1:`« Mes nids d’aigle touchent le ciel. Tes pierres retomberont bien avant de les atteindre. »`,p2:`« Il oublie une chose : tout ce qui est perché peut tomber. Fais-les basculer, la montagne fera le reste. »`},ch8:{title:`L’hiver`,p1:`« L’hiver est là. Gontran voudrait attendre le printemps… »`,p2:`« …mais la princesse est plus têtue que la glace. Prudence : la glace glisse, et se brise au moindre faux pas. »`},ch9:{title:`Sous l’orage`,p1:`« Je vois vos bannières depuis ma fenêtre. Mordrac enrage et jette ses dernières forces dans la tempête. Tenez bon. »`,p2:`« Il nous voit, Gontran ! Encore un effort, et nous serons aux portes de la capitale. »`},ch10:{title:`Le trône`,p1:`« Viens donc, princesse. Ce trône est à moi, et ton père ne le reverra jamais. »`,p2:`« Toute une vie à construire des machines… C’est pour ce jour-là que je les ai faites. »`,p3:`« Dix pays traversés, cent forteresses. Encore quelques tirs, maître d’engins, et le royaume sera libre. »`},epilogue:{title:`Épilogue`,p1:`La dernière tour s’effondre. Quand la poussière retombe, le duc Mordrac a fui, abandonnant sa couronne noire dans les gravats.`,p2:`« Ma fille… Tu as repris un royaume pierre après pierre. Cette couronne n’est plus pour moi : elle est pour toi. »`,p3:`« Et le premier acte de la reine sera de nommer un nouveau maître d’engins du royaume. Merci, apprenti. Merci d’avoir joué ! »`},lines:{l1:`Doucement, apprenti : règle l’angle, la puissance, et tire. Le bois ne résiste pas longtemps.`,l2:`Trois soldats, trois étages. Montre-leur que la princesse n’est pas seule.`,l3:`Tu vois ce pied de paille ? Brise-le, et toute la cabane s’écroulera. Cherche toujours le point faible.`,l4:`Un guetteur sur la passerelle nous a repérés. Fais-le taire avant qu’il donne l’alerte.`,l5:`Le vent se lève. J’ai un tour dans mon sac : l’Accalmie fait tomber le vent le temps d’un tir.`,l6:`Un château de cartes : le rez-de-chaussée est en paille. Retire la base, le reste suivra.`,l7:`Trois tours reliées par des planches, deux guetteurs dessus… plus pour longtemps.`,l8:`Ce moulin est fin comme un roseau. Avec la Force du Titan, ton boulet pèsera plus de deux fois plus lourd.`,l9:`Mes pots de feu grégeois ! Vise la paille du bas : le feu se chargera du reste.`,l10:`Une palissade est tombée ? J’en ai cent autres. Mon fort de bois vous attend, petite princesse.`,l11:`Voici mon rocher. Lourd, très lourd : garde-le pour la pierre, une simple pierre suffit au bois.`,l12:`Le guetteur, tout en haut de sa tour, voit tout le pays. Fais-le descendre.`,l13:`Des barils de poudre sous une tour de pierre… Une étincelle, et boum. Vise les barils.`,l14:`Mon trébuchet est prêt ! Il tire de plus loin et frappe plus fort. Un clic lâche le contrepoids, un second la fronde : tout est dans l’instant.`,l15:`Un chevalier en armure, au fond du donjon. Il faudra que tout lui tombe dessus.`,l16:`Plus de pot de feu ? Qu’importe : le pouvoir Feu grégeois enflamme même une simple pierre.`,l17:`Une tour de pierre posée sur un pont de bois. Casse le pont, la tour suit : c’est la clé de voûte.`,l18:`Des barils entre deux donjons. Une seule explosion pourrait ébranler les deux.`,l19:`Une nef de verre et un clocher. Avec la Salve, trois boulets partent en éventail.`,l20:`Mon fort de pierre a deux tours, un donjon et huit hommes. Ton jouet de bois n’y fera rien.`,l21:`Ma poudre noire ! La bombe explose à l’impact et brise même le fer. Vise les planchers de fer.`,l22:`Une salle de fer, scellée. La Charge de poudre fera exploser n’importe quel projectile.`,l23:`Ils se sont perchés sur la colline. Il faudra tirer en cloche, très haut.`,l24:`Toute la forteresse tient sur trois pieds de verre. Trois. Fragiles. Tu vois où je veux en venir ?`,l25:`Six maisons éparpillées. Tire la mitraille, puis touche l’écran en plein vol : elle se divise en trois.`,l26:`La tour de Babel : sept étages, du fer en son cœur. Mordrac la croit imprenable.`,l27:`Un aqueduc sur trois piliers. Abats celui du milieu, et toute la passerelle tombera.`,l28:`Une salle suspendue entre deux tours. Coupe le pont, et la salle tombera avec.`,l29:`Le monastère sert de caserne au duc. Son campanile surveille toute la vallée.`,l30:`Le seigneur de cette forteresse se cache au sommet du donjon. Tâchez donc de l’atteindre.`,l31:`Le sol tremble ? C’est le Séisme : il secoue tout le château, sans même tirer.`,l32:`Une citadelle sur un roc. Seul un tir en cloche passera par-dessus.`,l33:`Le deuxième étage est en paille. De la paille au milieu de la pierre… quelle drôle d’idée !`,l34:`Huit étages, du fer en bas. Inutile de taper au pied : fais-la basculer par le haut.`,l35:`Une cave pleine de barils sous une grande salle. Trouve l’entrée, et tout sautera.`,l36:`Quatre tours, deux passerelles, deux hauteurs. Choisis bien l’ordre de tes tirs.`,l37:`Deux tours sur une dalle, la dalle sur quatre pieds de verre. Tu connais la chanson.`,l38:`Une forteresse en escalier : chaque tour cache la suivante. Vise le fond, en cloche.`,l39:`Des salles de fer au sol, du bois fragile au-dessus. Le labyrinthe cache bien ses soldats.`,l40:`La grande citadelle : du fer, sept étages, et son seigneur au sommet. Ici s’arrête votre petite croisade.`,l41:`La brique : plus solide que le bois, moins que la pierre. Un bon rocher la fera céder.`,l42:`Sur pilotis, au-dessus de la vase. Un pied de paille, et tout plonge.`,l43:`Le hameau des marais : des maisons dispersées dans la brume. La mitraille sera ton amie.`,l44:`Deux tours de brique et leur passerelle. Les guetteurs nous observent à travers la brume.`,l45:`Une poudrière au milieu des roseaux. Garde un œil sur les barils… de loin.`,l46:`Un long rempart de briques. Des soldats dans chaque salle, et d’autres sur la galerie.`,l47:`Des tours serrées comme des dominos. La première entraîne toutes les autres.`,l48:`Un manoir sur l’eau, porté par des pieds de verre. Le verre ne sait pas nager.`,l49:`Le grand moulin : huit étages de brique et de bois. Il domine tout le marais.`,l50:`Mon fort des marais ne flotte pas : il s’enfonce… et vous avec.`,l51:`Voici le désert. Le grès s’effrite plus vite que la pierre, mais il reste lourd.`,l52:`Une mesa : un château sur un socle de roche. Tire en cloche, apprenti.`,l53:`L’oasis : des maisons de pisé autour du puits. Épargne le puits, nous avons soif.`,l54:`La citadelle des sables. Sous ce soleil, même les murs ont l’air de transpirer.`,l55:`Le caravansérail : des salles en enfilade sous une galerie. Les mercenaires y dorment.`,l56:`Les tours du vent. Ici, le vent ne se calme jamais : garde l’Accalmie sous la main.`,l57:`La poudrière du sultan. Il a vendu sa poudre à Mordrac : rendons-la-lui, d’un seul coup.`,l58:`Un grand escalier de tours. Vise le fond : chaque tour protège la suivante.`,l59:`La mesa fortifiée. Ils se croient hors d’atteinte, perchés sur leur roc.`,l60:`Mon palais des dunes vous engloutira, comme le sable engloutit les imprudents.`,l61:`La montagne, enfin. Un nid d’aigle accroché à la falaise. Ce qui est perché peut tomber.`,l62:`Un aqueduc de pierre garde le col. Le pilier central porte tout.`,l63:`Neuf étages ! Ce guetteur doit avoir le vertige. Fais-le redescendre plus vite que prévu.`,l64:`Un refuge sur pilotis de pierre. Plus solide que le verre, mais un pied reste un pied.`,l65:`L’escalier de la montagne : des tours de plus en plus hautes, et le seigneur tout en haut.`,l66:`La crypte du monastère : une salle blindée sous une salle fragile. Ouvre par le haut.`,l67:`Deux pics, deux tours, reliés par une passerelle au-dessus du vide.`,l68:`Un pont au-dessus du gouffre. Si la passerelle cède, tout le monde descend.`,l69:`La poudrière de la mine. Mordrac y entrepose sa poudre : une étincelle suffira.`,l70:`La forteresse des cimes est imprenable. Je l’ai fait graver sur sa porte.`,l71:`La glace ! Elle glisse comme du savon et se brise comme du verre. Tout peut arriver.`,l72:`Un palais de glace sur pilotis. Magnifique… et si fragile.`,l73:`Les soldats du duc se blottissent dans leurs maisons enneigées. Le feu grégeois les réchauffera.`,l74:`Des dominos gelés. Une poussée, et toute la rangée glisse.`,l75:`Les jumelles givrées : deux tours et une passerelle couverte de givre.`,l76:`Le rempart d’hiver : de la brique, de la glace, et des soldats frigorifiés.`,l77:`Une crypte sous la glace. Commence par le haut : la glace se brise, pas le fer.`,l78:`Un escalier gelé jusqu’aux nuages. Chaque marche est une tour.`,l79:`La poudrière du glacier. La poudre et la glace font très bon ménage… pour nous.`,l80:`Ma citadelle de glace ne fondra jamais. Toi, tu vas geler sur place.`,l81:`Je vois l’orage depuis ma tour… et vos bannières sous la pluie. Courage, mes enfants.`,l82:`Un aqueduc de brique au-dessus du torrent. Vise le pilier central.`,l83:`Un pont-levis de fer entre deux tours. Coupe la passerelle.`,l84:`La crypte du chevalier noir : du fer, des barils et un gardien de très mauvaise humeur.`,l85:`Des dominos de fer. Lourds à renverser… mais lourds à tomber, aussi.`,l86:`Le manoir foudroyé, sur ses pilotis de verre. La foudre a déjà commencé le travail.`,l87:`Le grand rempart : le dernier mur avant la capitale.`,l88:`Un escalier de fer et de brique. Ici, les bombes vaudront mieux que les pierres.`,l89:`Une poudrière dans la tempête. Une bombe sur les barils, et l’orage fera le reste.`,l90:`Le donjon de l’orage. Que la foudre vous frappe, toi et ta catapulte !`,l91:`La capitale. Une tour de marbre : la pierre la plus dure du royaume.`,l92:`La galerie des glaces. Pas de la glace, apprenti : des miroirs. Le verre, tu sais faire.`,l93:`Les jumelles royales. Mon père m’y emmenait enfant ; elles sont à l’ennemi désormais.`,l94:`Le trésor royal : une crypte de fer sous une salle de marbre. Mordrac y garde l’or du roi.`,l95:`Ce belvédère était mon refuge. Ne le ménagez pas : il repose sur des pieds de verre.`,l96:`L’escalier d’honneur. Au sommet, la salle du trône n’est plus très loin.`,l97:`Le pont du sacre : c’est ici qu’on couronnait les rois. Coupe-le, nous en bâtirons un autre.`,l98:`La poudrière de la couronne. Approche encore, et je fais tout sauter !`,l99:`Je suis tout près, dans la tour du trône. L’aqueduc impérial est le dernier rempart entre nous.`,l100:`Le trône est à moi ! Viens le prendre, si tu l’oses.`}},settings:{title:`Options`,sections:{display:`Affichage`,accessibility:`Accessibilité`,sound:`Son`,game:`Jeu`},language:`Langue`,theme:`Thème`,themes:{system:`Système`,light:`Clair`,dark:`Sombre`},contrast:`Contraste élevé`,motion:`Animations`,motions:{system:`Système`,reduced:`Réduites`,full:`Complètes`},uiScale:`Taille du texte`,scales:{1:`Normale`,"1_15":`Grande`,"1_3":`Très grande`},startPower:`Puissance au début du tour`,startPowers:{keep:`Garder`,100:`100 %`,75:`75 %`,50:`50 %`},tutorials:`Tutoriels guidés`,tutorialsDesc:`Une aide pas à pas la première fois qu’un outil apparaît.`,story:`Récit entre les niveaux`,storyDesc:`Affiche la Chronique avant les niveaux qui ouvrent un chapitre.`,trajectoryAid:`Aide à la trajectoire`,trajectoryAidDesc:`Affiche la courbe que suivra le projectile.`,slowSwing:`Balancier lent`,slowSwingDesc:`La fenêtre de tir du trébuchet dure plus longtemps : l’instant du lâcher est plus facile à choisir.`,infiniteSwing:`Balancier infini`,infiniteSwingDesc:`Sans second clic, le bras du trébuchet revient et recommence : prenez le temps de choisir votre tir. Sauf en Difficile.`,captions:`Sous-titres des sons`,captionsDesc:`Décrit à l’écran chaque son important, avec sa direction.`,announcements:`Annonces vocales`,announcementsDesc:`Informe les lecteurs d’écran des événements de la partie.`,haptics:`Vibrations`,hapticsDesc:`Sur les appareils compatibles.`,screenShake:`Tremblements de l’écran`,blood:`Effets de sang`,bloodDesc:`Une brève tache de sang quand une cible tombe. Désactivé : un nuage de poussière.`,music:`Musique`,musicDesc:`Bande son médiévale qui s’intensifie aux moments forts. 0 % pour la couper.`,volume:`Volume`,mute:`Couper le son`,difficulty:`Difficulté du profil`,reset:`Réinitialiser les options`,on:`Activé`,off:`Désactivé`},help:{trebuchetTitle:`Le trébuchet`,trebuchet:`Débloqué après le niveau 13, il se choisit avant chaque niveau (sauf au face-à-face). Il se joue uniquement au clic : le premier libère le contrepoids, le second lâche la fronde. Lâchez tôt pour un tir en cloche, tard pour un tir tendu. Il tire de plus loin que la catapulte mais frappe plus fort (pierres plus lourdes), et la caméra suit le tir. Un tic sonore monte avec l’angle du tir ; l’option « Balancier lent » ralentit le bras.`,modesTitle:`Modes de jeu`,modes:`Campagne : les 100 niveaux, avec étoiles et or. Mode libre : rejouez un niveau terminé sans limite. Deux joueurs, sur le même appareil : la campagne à deux en coopération, le duel (renommée), le tournoi en trois manches et le face-à-face (régicide).`,workshopTitle:`Atelier`,workshop:`Dépensez l’or gagné en campagne pour améliorer votre catapulte (puissance, poids des boulets, feu, poudre, munitions, tir en plus) ou changer son apparence. Les paliers avancés demandent aussi des étoiles.`,title:`Comment jouer`,goalTitle:`Le but`,goal:`Des soldats se cachent dans chaque forteresse. Réglez l’angle et la puissance de votre catapulte pour les éliminer tous avant d’épuiser vos tirs.`,aimTitle:`Viser et tirer`,aimTouch:`Écran tactile ou souris : faites glisser vers l’arrière, comme une fronde, puis appuyez sur « Tirer ».`,aimKeys:`Clavier : ← → pour l’angle, ↑ ↓ pour la puissance (Maj pour aller plus vite), Espace pour tirer, 1 à 5 pour les munitions, P pour la pause.`,aidTitle:`Aide à la trajectoire`,aid:`Activez-la dans les options pour voir la courbe du tir. Elle tient compte du vent.`,windTitle:`Le vent`,wind:`Il change à chaque tour et dévie les projectiles. Sa force est indiquée en haut de l’écran, et la manche à air près de la catapulte le montre aussi. En Difficile, il souffle bien plus fort, forcit en altitude (un tir en cloche dérive beaucoup plus qu’un tir tendu) et arrive en rafales : guettez les traînées d’air plus claires qui approchent pour choisir votre moment. Les projectiles lourds, comme le boulet, résistent mieux au vent, et le feu se propage dans son sens.`,materialsTitle:`Matériaux`,materials:`Du plus fragile au plus solide : verre, paille, glace, bois, grès, brique, pierre, marbre, fer. Les personnages, eux, tombent au moindre choc : ce sont les murs qui les protègent. La pierre de base ne suffit plus face à la pierre : prenez le rocher, les explosifs, ou améliorez votre catapulte à l’atelier.`,powersTitle:`Pouvoirs spéciaux`,powers:`Ils se débloquent en réussissant des niveaux. ’s nests clinging to the rocks. The wind picks up.`,8:`Ice slides and shatters: anything can topple.`,9:`Iron and brick in the storm. The wind is fierce.`,10:`The king’s marble. The final citadels.`},level:`Level {n}`,locked:`Locked`,lockedHint:`Beat the previous level`,best:`Best: {score}`,stars:{one:`{count} star`,other:`{count} stars`},totalStars:`{count}/{max} stars`,totalAch:`{count}/{max} achievements`,achCount:`{count} of 3 achievements`,totalScore:`Total score: {score}`,powers:`Powers`,demoLocked:`Full version`},game:{defenders:`Defenders`,turnOf:`{name}’s turn`,level:`Level {n}`,score:`Score`,targets:`Targets`,shots:`Shots`,wind:`Wind`,windCalm:`Calm`,windGusty:`Gusty wind`,gust:`Gust`,windLevels:{calm:`calm`,breeze:`breeze`,strong:`strong wind`,storm:`gale`},windValue:`{value} {dir}`,angle:`Angle`,power:`Power`,fire:`Fire`,split:`Split!`,pause:`Pause`,paused:`Game paused`,resume:`Resume`,restart:`Restart`,quit:`Quit level`,ammoTitle:`Ammunition`,infinite:`unlimited`,powersTitle:`Powers`,cost:`−{cost} pts`,armed:`Ready`,usedThisTurn:`Already used this turn`,unlocksAfter:`Unlocked after {count} levels`,aimHint:`Drag backwards to aim, then fire.`,engine:`Siege engine`,engines:{catapult:`Catapult`,trebuchet:`Trebuchet`},treb:{arm:`First click: drop the counterweight`,release:`Second click: release the sling!`,wait:`The shot is away…`,rewind:`The arm is coming back… get ready`,angle:`Angle`,speed:`Speed`,armBtn:`Arm`,releaseBtn:`Release!`,introHint:`Trebuchet: one click starts the swing, a second releases the sling. Release early for a high lob, late for a flat shot. The castle is further away, but the trebuchet hits harder.`},ammo:{stone:`Stone`,boulder:`Boulder`,fire:`Greek fire`,bomb:`Explosive shot`,split:`Grapeshot`},ammoDesc:{stone:`Standard projectile, unlimited.`,boulder:`Very heavy: ideal against stone.`,fire:`Sets wood, straw and soldiers ablaze.`,bomb:`Explodes on first contact.`,split:`Tap the screen mid-flight to split it in three.`}},powers:{calm:`Lull`,titan:`Titan’s Might`,greekfire:`Greek Fire`,volley:`Volley`,powder:`Powder Charge`,quake:`Earthquake`,desc:{calm:`The wind drops for this shot.`,titan:`Projectile 2.2 times heavier.`,greekfire:`The projectile sets fire to whatever it hits.`,volley:`Fires three projectiles in a fan.`,powder:`The projectile explodes on impact.`,quake:`The ground shakes under the castle right away.`},rule:`One power per turn. Each use costs points.`,unlocked:`New power unlocked: {name}`},intro:{goal:`Take out every target.`,shots:{one:`You have {count} shot.`,other:`You have {count} shots.`},new:`New`,go:`Attack!`,star3:{one:`in {count} shot`,other:`in {count} shots`},star2:{one:`in {count} shot`,other:`in {count} shots or fewer`},novelty:{"engine:trebuchet":`The trebuchet: a new, more powerful engine that fires from further back. You can then choose your engine before each level.`,"material:brick":`Brick holds better than wood, less than stone.`,"material:sandstone":`Sandstone is heavy but crumbles faster than stone.`,"material:ice":`Ice is slippery: a whole floor can slide off with one push.`,"material:marble":`Marble is the toughest wall of all: bring explosives.`,"material:wood":`Wood breaks easily and burns.`,"material:straw":`Straw is flimsy and catches fire very fast.`,"material:stone":`Stone is sturdy: aim for the weak points.`,"material:glass":`Stained glass shatters at the slightest knock.`,"material:iron":`Iron withstands almost anything except explosions.`,"target:soldier":`Soldiers fall at the slightest blow: the walls protect them, it is up to you to reach them.`,"target:knight":`Knights are worth more points, but they too fall at the slightest blow.`,"target:king":`The king is worth 1,500 points. Don’t miss him!`,barrel:`Powder kegs explode and wreck everything around them.`,"ammo:boulder":`New ammo: the boulder, very heavy.`,"ammo:fire":`New ammo: Greek fire, which sets wood alight.`,"ammo:bomb":`New ammo: the explosive shot.`,"ammo:split":`New ammo: grapeshot. Tap the screen mid-flight to split it.`}},ads:{introTitle:`Optional: watch a video for a helping hand on this level.`,introHint:`Video: first shot trajectory`,introHintReady:`First shot trajectory unlocked.`,introFree:`Video: one power with no point cost`,introFreeReady:`One free power: pick it during the level.`,freePower:`Free (video)`,hint:`Hint (video)`,hintGranted:`Hint: the trajectory is shown for this shot.`,playing:`Ad playing… The game resumes right after.`,offerTitle:`Out of ammunition!`,offerText:{one:`{count} defender is still standing. One last shot to finish the job?`,other:`{count} defenders are still standing. One last shot to finish the job?`},extraShot:`Watch a video: +1 shot`,extraShotGranted:`One more shot! Take aim.`,giveUp:`Accept defeat`,doubleGold:`Watch a video: double your gold`,goldDoubled:`Gold doubled: +{gold} gold coins.`,loading:`Loading video…`,unavailable:`Video unavailable right now.`},end:{gold:`+{gold} gold`,winner:`{name} wins!`,draw:`It’s a draw!`,cleared:`Level cleared!`,freeNote:`Free play: nothing is saved.`,nextRound:`{name}’s turn`,roundDraw:`Round drawn`,roundWon:`Round to {name}!`,roundDone:`{name}’s round is over`,rematch:`Rematch`,otherMatch:`Another match`,points:`{score} points`,defendersLeft:`{count} defender(s) standing`,victory:`The fortress has fallen!`,defeat:`The fortress stands firm`,defeatHint:`Try another angle, or a special ammo.`,score:`Score`,best:`Best`,newBest:`New record!`,shotsUsed:{zero:`Victory without firing!`,one:`Won in {count} shot`,other:`Won in {count} shots`},star3Hint:{one:`3 stars in {count} shot`,other:`3 stars in {count} shots`},next:`Next level`,retry:`Try again`,levels:`Level map`,campaignDone:`You have conquered all 100 fortresses. Well done, my lord!`,demoDone:`End of the demo! The full version has 100 levels and 6 powers.`,saveError:`Your progress couldn’t be saved.`},ach:{title:`Achievements`,done:`Unlocked`,todo:`To do`,fresh:`New!`,pure:{name:`Purist`,desc:`Win without firing any special shot.`},humble:{name:`No tricks`,desc:`Win without using a power.`},frugal:{name:`Thrifty`,desc:`Win in {n} shot(s) or fewer.`},sparing:{name:`Sparing`,desc:`Win firing at most one special shot.`},lastStand:{name:`Down to the wire`,desc:`Win with your very last shot.`},stoic:{name:`Come wind or weather`,desc:`Win with no power and no special shot, despite the wind.`},chain:{name:`Chain reaction`,desc:`Destroy {n} things with a single shot.`},carton:{name:`Bullseye`,desc:`Take out {n} targets with one shot.`},opening:{name:`Grand entrance`,desc:`Take out {n} targets with your first shot.`},clean:{name:`In one blow`,desc:`Take out every target with one shot.`},demolisher:{name:`Wrecker`,desc:`Raze at least {n}% of the castle.`},surgeon:{name:`Surgeon`,desc:`Win while destroying at most {n}% of the castle.`},powder:{name:`Fireworks`,desc:`Blow up every barrel.`},regicide:{name:`Regicide`,desc:`Bring down the king before all his guards.`},pyro:{name:`Pyromaniac`,desc:`Take out two targets with fire.`},artificer:{name:`Blaster`,desc:`Take out two targets with an explosion.`},landslide:{name:`Landslide`,desc:`Crush two targets under the rubble.`},freefall:{name:`Free fall`,desc:`Make a target fall from up high.`}},tutorial:{title:`Tutorial: {name}`,aimTitle:`Tutorial: aim and fire`,engine:{arm:`The trebuchet is played by clicking. Tap the scene (or “Arm”, or Space): the counterweight drops and the arm starts to swing.`,release:`The arm is swinging! Tap again to release the sling. The dotted line shows the shot right now: release when it lands on the castle.`,watch:`The camera follows the projectile all the way to the castle…`,done:`Release early: high lob. Release late: flat shot. Before each level, you can choose between catapult and trebuchet.`},skip:`Skip`,close:`Got it`,aim:{aim:`Set the angle and power: drag backwards from the catapult, or use the sliders below. The dotted line shows the trajectory.`,fire:`Perfect. Press “Fire” (or Space).`,watch:`Watch: a soldier falls at the slightest knock, but the walls protect him.`,done:`Your turn! In the next levels, the wind (top right) will push your shots.`},step:{select:`Pick “{name}” in the ammo bar.`,open:`Open the powers menu at the top of the screen.`,use:`Activate “{name}”. One power per turn, and it costs points.`,watch:`Watch what happens…`},tips:{ammo_fire:`Aim at the straw on the ground floor: it bursts into flames in two seconds, wood burns more slowly. Then fire.`,ammo_boulder:`The boulder is very heavy: aim at the stone base to smash it. Then fire.`,ammo_bomb:`The bomb explodes on impact and breaks iron. Aim at the iron floors, then fire.`,ammo_split:`Fire, then tap the screen (or “Split!”) in mid-air: the grapeshot splits in three.`,power_calm:`The wind drops for this shot: aim as if the air were still, then fire.`,power_titan:`Your projectile weighs more than twice as much. Aim at the top of the mill to tip it over, then fire.`,power_greekfire:`Your next projectile, even a plain stone, will set fire to whatever it hits. Aim at the straw, then fire.`,power_volley:`Three projectiles fan out: ideal against glass. Fire.`,power_powder:`Your projectile will explode on impact, like a bomb. Aim at the iron room, then fire.`,power_quake:`The ground shakes under the whole castle.`},done:{ammo_fire:`Fire spreads on its own, and a target that catches fire is out. Your turn!`,ammo_boulder:`Keep the boulder for stone: against wood, a plain stone is often enough.`,ammo_bomb:`An explosion also sets off nearby barrels. Iron only gives way to explosives.`,ammo_split:`The earlier you split, the wider the grapeshot spreads.`,power_calm:`Save Lull for precise shots in strong wind.`,power_titan:`Titan’s Might turns a stone into a battering ram.`,power_greekfire:`With straw and wood around, the blaze does the rest.`,power_volley:`Three chances to hit: perfect against scattered targets.`,power_powder:`Powder Charge opens what stone cannot break.`,power_quake:`Earthquake shakes the whole castle without counting as a shot.`}},characters:{ysolde:{name:`Princess Ysolde`,role:`Heir to the kingdom`},aubert:{name:`King Aubert`,role:`The captive king`},gontran:{name:`Master Gontran`,role:`Royal engineer`},mordrac:{name:`Duke Mordrac`,role:`The usurper`}},story:{skip:`Skip`,next:`Next`,previous:`Previous page`,close:`Continue`,page:`Page {n} of {total}`,chronicle:`The Chronicle`,chronicleIntro:`Read again the episodes you have discovered.`,readEpilogue:`Read the epilogue`,prologue:{title:`The siege master`,p1:`In the year of grace 1214, on a moonless night, Duke Mordrac forced the gates of the capital. Betrayed by his guard, old King Aubert was locked away at the top of his own tower.`,p2:`“My father is alive, I know it. I will not let this usurper wear his crown. Who will follow me?”`,p3:`“I will, Your Highness, with my old catapult. My eyes don’t aim as well as they used to… but I have trained an apprentice.”`,p4:`“Your turn, apprentice. Mordrac’s first forts are only wood and straw. Set your aim: I’ll teach you the rest along the way.”`},ch2:{title:`The age of stone`,p1:`“A princess, an old man and a wooden contraption? My stone forts are waiting for you. So are my knights.”`,p2:`“Stone, eh? I’ve cut boulders that will make it shake. Save them for the walls, apprentice.”`},ch3:{title:`Black powder`,p1:`“Look what I came up with this winter: black powder. Not even iron can stand against it.”`,p2:`“The eastern fortresses guard Mordrac’s barrels. One spark in the right place, and his whole arsenal goes up.”`},ch4:{title:`The citadels`,p1:`“My daughter, do not come for me. Mordrac has fortified every rock between us. Save the kingdom, not an old man.”`,p2:`“He asks me to give up? He hardly knows me. On these rocks, we’ll have to lob our shots. Onwards!”`},ch5:{title:`Crossing the marshes`,p1:`“You took my citadels? Very well. May the marshes swallow all three of you.”`,p2:`“Brick houses on stilts… One rotten stilt and the whole thing sinks into the mud. Aim for the weak spots.”`},ch6:{title:`The scorched lands`,p1:`“The duke’s mercenaries hold the desert. Their sandstone forts crumble in the sun… and our water is running out.”`,p2:`“Then every shot must count. No waste, apprentice.”`},ch7:{title:`The eagles’ nests`,p1:`“My eagles’ nests touch the sky. Your stones will fall back long before they reach them.”`,p2:`“He forgets one thing: whatever is perched can fall. Tip them over, the mountain will do the rest.”`},ch8:{title:`Winter`,p1:`“Winter is here. Gontran would rather wait for spring…”`,p2:`“…but the princess is more stubborn than ice. Careful: ice slips, and shatters at the slightest misstep.”`},ch9:{title:`Under the storm`,p1:`“I can see your banners from my window. Mordrac is raging and throwing his last forces into the storm. Hold on.”`,p2:`“He can see us, Gontran! One more push, and we’ll be at the gates of the capital.”`},ch10:{title:`The throne`,p1:`“Come then, princess. This throne is mine, and your father will never see it again.”`,p2:`“A whole life building machines… This is the day I built them for.”`,p3:`“Ten lands crossed, a hundred fortresses. A few more shots, siege master, and the kingdom will be free.”`},epilogue:{title:`Epilogue`,p1:`The last tower collapses. When the dust settles, Duke Mordrac has fled, leaving his black crown in the rubble.`,p2:`“My daughter… You won back a kingdom, stone by stone. This crown is no longer mine: it is yours.”`,p3:`“And the queen’s first act will be to name a new siege master of the realm. Thank you, apprentice. Thank you for playing!”`},lines:{l1:`Easy, apprentice: set the angle, the power, and fire. Wood doesn’t hold out for long.`,l2:`Three soldiers, three floors. Show them the princess is not alone.`,l3:`See that straw stilt? Break it, and the whole hut comes down. Always look for the weak spot.`,l4:`A lookout on the walkway has spotted us. Silence him before he raises the alarm.`,l5:`The wind is rising. I’ve got a trick up my sleeve: Lull drops the wind for one shot.`,l6:`A house of cards: the ground floor is straw. Take out the base, the rest will follow.`,l7:`Three towers linked by planks, two lookouts on top… not for long.`,l8:`This mill is as thin as a reed. With Titan’s Might, your shot will weigh more than twice as much.`,l9:`My Greek fire pots! Aim at the straw below: the fire will take care of the rest.`,l10:`One palisade has fallen? I have a hundred more. My wooden fort awaits you, little princess.`,l11:`Here’s my boulder. Heavy, very heavy: save it for stone, a plain stone will do for wood.`,l12:`The lookout at the top of his tower can see the whole land. Bring him down.`,l13:`Powder barrels under a stone tower… One spark, and boom. Aim for the barrels.`,l14:`My trebuchet is ready! It fires from further back and hits harder. One click drops the counterweight, a second releases the sling: it is all in the timing.`,l15:`A knight in armour, deep inside the keep. Everything will have to fall on him.`,l16:`Out of fire pots? No matter: the Greek Fire power sets even a plain stone ablaze.`,l17:`A stone tower standing on a wooden bridge. Break the bridge, the tower follows: that’s the keystone.`,l18:`Barrels between two keeps. A single explosion could shake them both.`,l19:`A glass nave and a bell tower. With Volley, three shots fan out at once.`,l20:`My stone fort has two towers, a keep and eight men. Your wooden toy will do nothing.`,l21:`My black powder! The bomb explodes on impact and breaks even iron. Aim at the iron floors.`,l22:`A sealed iron room. Powder Charge will make any projectile explode.`,l23:`They’ve perched on the hill. You’ll have to lob your shot, very high.`,l24:`The whole fortress stands on three glass legs. Three. Fragile. See where I’m going with this?`,l25:`Six scattered houses. Fire the grapeshot, then tap the screen in mid-air: it splits in three.`,l26:`The Tower of Babel: seven floors, with iron at its heart. Mordrac thinks it can’t be taken.`,l27:`An aqueduct on three pillars. Bring down the middle one, and the whole walkway will fall.`,l28:`A hall hanging between two towers. Cut the bridge, and the hall falls with it.`,l29:`The monastery serves as the duke’s barracks. Its bell tower watches over the whole valley.`,l30:`The lord of this fortress hides at the top of the keep. Do try to reach him.`,l31:`The ground is shaking? That’s Earthquake: it shakes the whole castle without even firing.`,l32:`A citadel on a rock. Only a lob will get over it.`,l33:`The second floor is straw. Straw in the middle of stone… what a strange idea!`,l34:`Eight floors, iron at the bottom. No use hitting the base: tip it over from the top.`,l35:`A cellar full of barrels under a great hall. Find the way in, and everything goes up.`,l36:`Four towers, two walkways, two heights. Choose the order of your shots wisely.`,l37:`Two towers on a slab, the slab on four glass legs. You know the tune.`,l38:`A stepped fortress: each tower hides the next. Lob your shots towards the back.`,l39:`Iron rooms on the ground, fragile wood above. The maze hides its soldiers well.`,l40:`The great citadel: iron, seven floors, and its lord at the top. Here your little crusade ends.`,l41:`Brick: sturdier than wood, weaker than stone. A good boulder will break it.`,l42:`On stilts, above the mud. One straw leg, and everything sinks.`,l43:`The marsh hamlet: houses scattered in the mist. Grapeshot will be your friend.`,l44:`Two brick towers and their walkway. The lookouts are watching us through the mist.`,l45:`A powder store among the reeds. Keep an eye on the barrels… from afar.`,l46:`A long brick rampart. Soldiers in every room, and more on the gallery.`,l47:`Towers packed like dominoes. The first one takes all the others down.`,l48:`A manor on the water, standing on glass legs. Glass can’t swim.`,l49:`The great mill: eight floors of brick and wood. It towers over the whole marsh.`,l50:`My marsh fort doesn’t float: it sinks… and you with it.`,l51:`Here is the desert. Sandstone crumbles faster than stone, but it’s still heavy.`,l52:`A mesa: a castle on a rock base. Lob your shot, apprentice.`,l53:`The oasis: mud-brick houses around the well. Spare the well, we’re thirsty.`,l54:`The sand citadel. Under this sun, even the walls seem to sweat.`,l55:`The caravanserai: a row of rooms under a gallery. The mercenaries sleep there.`,l56:`The towers of the wind. Here the wind never calms: keep Lull close at hand.`,l57:`The sultan’s powder store. He sold his powder to Mordrac: let’s give it back, all at once.`,l58:`A great staircase of towers. Aim at the back: each tower shields the next.`,l59:`The fortified mesa. They think they’re out of reach, perched on their rock.`,l60:`My dune palace will swallow you, as the sand swallows the reckless.`,l61:`The mountains, at last. An eagle’s nest clinging to the cliff. Whatever is perched can fall.`,l62:`A stone aqueduct guards the pass. The central pillar holds everything up.`,l63:`Nine floors! That lookout must get dizzy. Bring him down faster than planned.`,l64:`A refuge on stone stilts. Sturdier than glass, but a leg is still a leg.`,l65:`The mountain staircase: taller and taller towers, and the lord at the very top.`,l66:`The monastery crypt: an armoured room under a fragile one. Open it from the top.`,l67:`Two peaks, two towers, linked by a walkway over the void.`,l68:`A bridge over the chasm. If the walkway gives way, everyone goes down.`,l69:`The mine’s powder store. Mordrac keeps his powder there: one spark will do.`,l70:`The fortress of the peaks is impregnable. I had it carved on its gate.`,l71:`Ice! It slips like soap and breaks like glass. Anything can happen.`,l72:`An ice palace on stilts. Magnificent… and so fragile.`,l73:`The duke’s soldiers huddle in their snowy houses. Greek fire will warm them up.`,l74:`Frozen dominoes. One push, and the whole row slides.`,l75:`The frosted twins: two towers and a walkway covered in frost.`,l76:`The winter rampart: brick, ice, and frozen soldiers.`,l77:`A crypt under the ice. Start from the top: ice breaks, iron doesn’t.`,l78:`A frozen staircase up to the clouds. Every step is a tower.`,l79:`The glacier’s powder store. Powder and ice get along very well… for us.`,l80:`My ice citadel will never melt. You, however, will freeze on the spot.`,l81:`I can see the storm from my tower… and your banners in the rain. Courage, my children.`,l82:`A brick aqueduct over the torrent. Aim at the central pillar.`,l83:`An iron drawbridge between two towers. Cut the walkway.`,l84:`The black knight’s crypt: iron, barrels, and a very bad-tempered guardian.`,l85:`Iron dominoes. Heavy to push over… but heavy to fall, too.`,l86:`The lightning-struck manor, on its glass stilts. The lightning has already started the job.`,l87:`The great rampart: the last wall before the capital.`,l88:`A staircase of iron and brick. Here, bombs will be worth more than stones.`,l89:`A powder store in the storm. A bomb on the barrels, and the storm will do the rest.`,l90:`The storm keep. May lightning strike you down, you and your catapult!`,l91:`The capital. A marble tower: the hardest stone in the kingdom.`,l92:`The hall of mirrors. Not ice, apprentice: mirrors. Glass, you know how to handle.`,l93:`The royal twins. My father used to take me there as a child; now they belong to the enemy.`,l94:`The royal treasury: an iron crypt under a marble hall. Mordrac keeps the king’s gold there.`,l95:`This belvedere was my refuge. Don’t spare it: it stands on glass legs.`,l96:`The grand staircase. At the top, the throne room is not far.`,l97:`The coronation bridge: this is where kings were crowned. Cut it, we’ll build another.`,l98:`The crown’s powder store. Come any closer, and I’ll blow it all up!`,l99:`I am close, in the throne tower. The imperial aqueduct is the last wall between us.`,l100:`The throne is mine! Come and take it, if you dare.`}},settings:{title:`Settings`,sections:{display:`Display`,accessibility:`Accessibility`,sound:`Sound`,game:`Game`},language:`Language`,theme:`Theme`,themes:{system:`System`,light:`Light`,dark:`Dark`},contrast:`High contrast`,motion:`Animations`,motions:{system:`System`,reduced:`Reduced`,full:`Full`},uiScale:`Text size`,scales:{1:`Normal`,"1_15":`Large`,"1_3":`Extra large`},startPower:`Power at the start of each turn`,startPowers:{keep:`Keep`,100:`100%`,75:`75%`,50:`50%`},tutorials:`Guided tutorials`,tutorialsDesc:`Step-by-step help the first time a tool appears.`,story:`Story between levels`,storyDesc:`Shows the Chronicle before the levels that open a chapter.`,trajectoryAid:`Trajectory aid`,trajectoryAidDesc:`Shows the curve the projectile will follow.`,slowSwing:`Slow swing`,slowSwingDesc:`The trebuchet’s release window lasts longer, making the release easier to time.`,infiniteSwing:`Endless swing`,infiniteSwingDesc:`Without a second click, the trebuchet arm comes back and swings again: take your time to choose your shot. Except on Hard.`,captions:`Sound captions`,captionsDesc:`Describes every important sound on screen, with its direction.`,announcements:`Spoken announcements`,announcementsDesc:`Tells screen readers what happens in the game.`,haptics:`Vibration`,hapticsDesc:`On supported devices.`,screenShake:`Screen shake`,blood:`Blood effects`,bloodDesc:`A brief blood stain when a target falls. Off: a puff of dust.`,music:`Music`,musicDesc:`Medieval soundtrack that builds up at the big moments. 0% turns it off.`,volume:`Volume`,mute:`Mute`,difficulty:`Profile difficulty`,reset:`Reset settings`,on:`On`,off:`Off`},help:{trebuchetTitle:`The trebuchet`,trebuchet:`Unlocked after level 13, you choose it before each level (except head-to-head). It is played only by clicking: the first click drops the counterweight, the second releases the sling. Release early for a high lob, late for a flat shot. It fires from further back than the catapult but hits harder (heavier stones), and the camera follows the shot. A tick sound rises with the shot angle; the “Slow swing” option slows the arm down.`,modesTitle:`Game modes`,modes:`Campaign: all 100 levels, with stars and gold. Free play: replay a cleared level without limits. Two players on the same device: the cooperative two-player campaign, the duel (renown), the three-round tournament and the face-off (regicide).`,workshopTitle:`Workshop`,workshop:`Spend campaign gold to upgrade your catapult (power, heavier shot, fire, powder, ammo, an extra shot) or change its look. Advanced tiers also require stars.`,title:`How to play`,goalTitle:`The goal`,goal:`Soldiers hide in every fortress. Set your catapult’s angle and power to take them all out before you run out of shots.`,aimTitle:`Aiming and firing`,aimTouch:`Touch screen or mouse: drag backwards, like a slingshot, then press “Fire”.`,aimKeys:`Keyboard: ← → for angle, ↑ ↓ for power (Shift to go faster), Space to fire, 1 to 5 for ammo, P to pause.`,aidTitle:`Trajectory aid`,aid:`Turn it on in settings to see the shot’s curve. It accounts for the wind.`,windTitle:`Wind`,wind:`It changes every turn and pushes projectiles off course. Its strength is shown at the top of the screen, and the windsock next to the catapult shows it too. On Hard, it blows much harder, gets stronger higher up (a lob drifts far more than a flat shot) and comes in gusts: watch for the brighter air streaks heading your way to time your shot. Heavy projectiles such as the boulder resist the wind better, and fire spreads the way it blows.`,materialsTitle:`Materials`,materials:`From weakest to strongest: glass, straw, ice, wood, sandstone, brick, stone, marble, iron. The characters fall at the slightest blow: the walls are what protect them. A plain stone is no match for stone walls any more: use the boulder, explosives, or upgrade your catapult at the workshop.`,powersTitle:`Special powers`,powers:`You unlock them by beating levels. One per turn, and each one costs points.`,scoreTitle:`Points and stars`,score:`Every destruction earns points, more so as part of a chain reaction. Unused shots are worth 1,000 points. Stars depend on how many shots you use: 3 stars for a single shot (two for the big castles).`,achTitle:`Achievements`,ach:`Each level offers three achievements (win without special shots, blow up every barrel, take the king first…). They add up from one game to the next and earn gold.`},modes:{title:`More modes`,hint:`Endless siege, workshop, two players`,chooseProfile:`Choose a profile`,duoDesc:`On the same device: two-player campaign, duel, tournament and head-to-head.`,duoOpen:`Play with two`},endless:{title:`Endless siege`,desc:`Castle after castle, harder and harder. Each castle you take earns you shots; the siege ends when a castle holds.`,start:`Start a siege`,locked:`Unlocked after {count} campaign levels`,record2:{one:`Best: {count} castle, {score} pts`,other:`Best: {count} castles, {score} pts`},rules:`You start with 6 shots. Each castle you take earns 3 more (4 if it falls with the first shot), and remaining shots carry over to the next castle.`,castle:`Castle {n}`,shots:{one:`{count} shot for this castle`,other:`{count} shots for this castle`},castleDown:`Castle {n} taken!`,bonus:{one:`+{count} shot`,other:`+{count} shots`},total:`Siege total: {score} pts`,next:`Castle {n}`,stop:`End the siege`,over:{zero:`The siege ends here`,one:`Siege over: {count} castle taken`,other:`Siege over: {count} castles taken`},record:`New record!`,best:`Your best: {score} pts`,again:`New siege`},editor:{title:`Castle workshop`,desc:`Build your castle piece by piece, take it yourself, then send it to your friends.`,open:`Open the workshop`,count:`Pieces: {parts}/{max} · defenders: {targets}`,undo:`Undo`,settings:`Settings`,test:`Test`,share:`Share`,clear:`Clear all`,verifyFirst:`Take your own castle first to be able to share it.`,canvasLabel:`Building area. Tap to place the chosen piece. Keyboard: left and right arrows move the cursor, Enter places, Delete removes.`,partsLabel:`Pieces`,materialLabel:`Material`,parts:{room:`Floor`,wall:`Wall`,plank:`Beam`,base:`Base`,roof:`Roof`,soldie d":`Kayu mudah patah dan terbakar.`,"material:straw":`Jerami rapuh dan sangat cepat terbakar.`,"material:stone":`Batu itu kokoh: incar titik lemahnya.`,"material:glass":`Kaca patri hancur dengan benturan sekecil apa pun.`,"material:iron":`Besi tahan hampir segalanya, kecuali ledakan.`,"target:soldier":`Prajurit tumbang oleh benturan sekecil apa pun: dinding melindungi mereka, tugas Anda menjangkaunya.`,"target:knight":`Ksatria bernilai lebih banyak poin, tetapi juga tumbang oleh benturan sekecil apa pun.`,"target:king":`Sang raja bernilai 1.500 poin. Jangan sampai lolos!`,barrel:`Tong mesiu meledak dan menghancurkan sekitarnya.`,"ammo:boulder":`Amunisi baru: bongkahan batu yang sangat berat.`,"ammo:fire":`Amunisi baru: api Yunani, yang membakar kayu.`,"ammo:bomb":`Amunisi baru: peluru peledak.`,"ammo:split":`Amunisi baru: peluru sebar. Ketuk layar saat melayang untuk memecahnya.`}},ads:{introTitle:`Opsional: tonton video untuk bantuan di level ini.`,introHint:`Video: lintasan tembakan pertama`,introHintReady:`Lintasan tembakan pertama terbuka.`,introFree:`Video: satu kekuatan tanpa potongan poin`,introFreeReady:`Satu kekuatan gratis: pilih saat level berlangsung.`,freePower:`Gratis (video)`,hint:`Petunjuk (video)`,hintGranted:`Petunjuk: lintasan ditampilkan untuk tembakan ini.`,playing:`Iklan sedang diputar… Permainan berlanjut sesudahnya.`,offerTitle:`Amunisi habis!`,offerText:{other:`Masih ada {count} pembela. Satu tembakan terakhir untuk menuntaskannya?`},extraShot:`Tonton video: +1 tembakan`,extraShotGranted:`Satu tembakan lagi! Bidik sekarang.`,giveUp:`Terima kekalahan`,doubleGold:`Tonton video: gandakan emas`,goldDoubled:`Emas digandakan: +{gold} keping emas.`,loading:`Memuat video…`,unavailable:`Video belum tersedia saat ini.`},end:{gold:`+{gold} emas`,winner:`{name} menang!`,draw:`Seri!`,cleared:`Level bersih!`,freeNote:`Mode bebas: tidak ada yang disimpan.`,nextRound:`Giliran {name}`,roundDraw:`Babak seri`,roundWon:`Babak untuk {name}!`,roundDone:`Babak {na aran di bawah reruntuhan.`},freefall:{name:`Jatuh bebas`,desc:`Jatuhkan satu sasaran dari ketinggian.`}},tutorial:{title:`Tutorial: {name}`,aimTitle:`Tutorial: membidik dan menembak`,engine:{arm:`Trebuset dimainkan dengan klik. Ketuk layar (atau “Siagakan”, atau Spasi): pemberat jatuh dan lengan mulai berayun.`,release:`Lengan berayun! Ketuk lagi untuk melepas ambin. Garis titik-titik menunjukkan tembakan saat ini: lepaskan saat jatuh di kastel.`,watch:`Kamera mengikuti proyektil sampai ke kastel…`,done:`Lepas awal: melengkung tinggi. Lepas lambat: datar. Sebelum setiap level, Anda bisa memilih katapel atau trebuset.`},skip:`Lewati`,close:`Mengerti`,aim:{aim:`Atur sudut dan kekuatan: tarik ke belakang dari katapel, atau gunakan penggeser di bawah. Garis titik-titik menunjukkan lintasan.`,fire:`Bagus. Tekan “Tembak” (atau Spasi).`,watch:`Perhatikan: prajurit jatuh oleh benturan sekecil apa pun, tetapi dinding melindunginya.`,done:`Giliranmu! Di level berikutnya, angin (kanan atas) akan membelokkan tembakanmu.`},step:{select:`Pilih “{name}” di bilah amunisi.`,open:`Buka menu kekuatan di bagian atas layar.`,use:`Aktifkan “{name}”. Satu kekuatan per giliran, dan memakai poin.`,watch:`Lihat hasilnya…`},tips:{ammo_fire:`Bidik jerami di lantai dasar: jerami terbakar dalam dua detik, kayu terbakar lebih lambat. Lalu tembak.`,ammo_boulder:`Batu besar sangat berat: bidik dasar batu untuk menghancurkannya. Lalu tembak.`,ammo_bomb:`Bom meledak saat mengenai sasaran dan menghancurkan besi. Bidik lantai besi, lalu tembak.`,ammo_split:`Tembak, lalu sentuh layar (atau “Pecah!”) saat melayang: peluru gotri terpecah tiga.`,power_calm:`Angin berhenti untuk tembakan ini: bidik seolah udara tenang, lalu tembak.`,power_titan:`Proyektilmu lebih dari dua kali lebih berat. Bidik puncak kincir untuk merobohkannya, lalu tembak.`,power_greekfire:`Proyektil berikutnya, bahkan batu biasa, akan membakar apa pun yang dikenainya. Bidik jerami, lalu tembak.`,power_volley:`Tiga proyektil melesat menyebar: cocok untuk kaca. Tembak.`,power_powder:`Proyektilmu akan meledak seperti bom. Bidik ruang besi, lalu tembak.`,power_quake:`Tanah berguncang di bawah seluruh kastel.`},done:{ammo_fire:`Api menyebar sendiri, dan sasaran yang terbakar langsung kalah. Giliranmu!`,ammo_boulder:`Simpan batu besar untuk batu: melawan kayu, batu biasa sering cukup.`,ammo_bomb:`Ledakan juga memicu tong di dekatnya. Besi hanya kalah oleh bahan peledak.`,ammo_split:`Makin cepat dipecah, makin lebar sebaran gotri.`,power_calm:`Simpan Angin Reda untuk tembakan presisi saat angin kencang.`,power_titan:`Kekuatan Titan mengubah batu menjadi pendobrak.`,power_greekfire:`Dengan jerami dan kayu, kebakaran mengurus sisanya.`,power_volley:`Tiga peluang mengenai: sempurna untuk sasaran yang tersebar.`,power_powder:`Isian Mesiu membuka apa yang tak tertembus batu.`,power_quake:`Gempa mengguncang seluruh kastel tanpa dihitung sebagai tembakan.`}},characters:{ysolde:{name:`Putri Ysolde`,role:`Pewaris kerajaan`},aubert:{name:`Raja Aubert`,role:`Raja yang ditawan`},gontran:{name:`Tuan Gontran`,role:`Insinyur kerajaan`},mordrac:{name:`Adipati Mordrac`,role:`Sang perebut takhta`}},story:{skip:`Lewati`,next:`Lanjut`,previous:`Halaman sebelumnya`,close:`Lanjutkan`,page:`Halaman {n} dari {total}`,chronicle:`Hikayat`,chronicleIntro:`Baca lagi episode yang sudah kamu temukan.`,readEpilogue:`Baca epilog`,prologue:{title:`Sang ahli pelontar`,p1:`Tahun 1214. Pada malam tanpa bulan, Adipati Mordrac mendobrak gerbang ibu kota. Dikhianati pengawalnya sendiri, Raja Aubert yang tua dikurung di puncak menaranya.`,p2:`“Ayahku masih hidup, aku yakin. Aku tak akan membiarkan perebut takhta itu memakai mahkotanya. Siapa yang mau ikut denganku?”`,p3:`“Saya, Tuan Putri, bersama katapel tua saya. Mata saya tak lagi setajam dulu… tetapi saya punya seorang murid.”`,p4:`“Giliranmu, murid. Benteng pertama Mordrac hanya kayu dan jerami. Atur bidikanmu: sisanya akan kuajarkan di jalan.”`},ch2:{title:`Masa batu`,p1:`“Seorang putri, seorang kakek, dan mesin kayu? Benteng batuku menunggu kalian. Ksatria-ksatriaku juga.”`,p2:`“Batu, ya? Aku sudah memahat batu besar yang akan membuatnya bergetar. Simpan untuk dinding, murid.”`},ch3:{title:`Bubuk hitam`,p1:`“Lihat temuanku musim dingin ini: bubuk hitam. Bahkan besi pun tak sanggup menahannya.”`,p2:`“Benteng-benteng timur menyimpan tong-tong Mordrac. Satu percikan di tempat yang tepat, dan seluruh gudang senjatanya meledak.”`},ch4:{title:`Para benteng induk`,p1:`“Putriku, jangan datang menjemputku. Mordrac telah memperkuat setiap batu karang di antara kita. Selamatkan kerajaan, bukan orang tua ini.”`,p2:`“Ia memintaku menyerah? Ia belum mengenalku. Di atas karang ini, kita harus menembak melengkung. Maju!”`},ch5:{title:`Menyeberangi rawa`,p1:`“Kalian merebut benteng-bentengku? Baiklah. Semoga rawa menelan kalian bertiga.”`,p2:`“Rumah bata di atas tiang… Satu tiang lapuk, dan semuanya tercebur ke lumpur. Bidik titik lemahnya.”`},ch6:{title:`Tanah hangus`,p1:`“Tentara bayaran sang adipati menguasai gurun. Benteng batu pasir mereka rapuh di bawah matahari… dan air kita hampir habis.”`,p2:`“Kalau begitu setiap tembakan harus berarti. Jangan boros, murid.”`},ch7:{title:`Sarang elang`,p1:`“Sarang elangku menyentuh langit. Batumu akan jatuh jauh sebelum mencapainya.”`,p2:`“Ia lupa satu hal: apa pun yang bertengger bisa jatuh. Robohkan, gunung akan mengurus sisanya.”`},ch8:{title:`Musim dingin`,p1:`“Musim dingin telah tiba. Gontran ingin menunggu musim semi…”`,p2:`“…tetapi sang putri lebih keras kepala daripada es. Hati-hati: es licin, dan pecah karena salah langkah sedikit saja.”`},ch9:{title:`Di bawah badai`,p1:`“Aku melihat panji-panji kalian dari jendelaku. Mordrac murka dan mengerahkan pasukan terakhirnya ke dalam badai. Bertahanlah.”`,p2:`“Ia melihat kita, Gontran! Sedikit lagi, dan kita sampai di gerbang ibu kota.”`},ch10:{title:`Takhta`,p1:`“Datanglah, putri. Takhta ini milikku, dan ayahmu tak akan pernah melihatnya lagi.”`,p2:`“Seumur hidup membuat mesin… Untuk hari inilah aku membuatnya.”`,p3:`“Sepuluh negeri dilalui, seratus benteng. Beberapa tembakan lagi, ahli pelontar, dan kerajaan akan bebas.”`},epilogue:{title:`Epilog`,p1:`Menara terakhir runtuh. Ketika debu mengendap, Adipati Mordrac telah kabur, meninggalkan mahkota hitamnya di antara reruntuhan.`,p2:`“Putriku… Kau merebut kembali kerajaan, batu demi batu. Mahkota ini bukan lagi milikku: ini milikmu.”`,p3:`“Dan titah pertama sang ratu adalah mengangkat ahli pelontar kerajaan yang baru. Terima kasih, murid. Terima kasih telah bermain!”`},lines:{l1:`Pelan-pelan, murid: atur sudut, kekuatan, lalu tembak. Kayu tak akan bertahan lama.`,l2:`Tiga prajurit, tiga lantai. Tunjukkan bahwa sang putri tidak sendirian.`,l3:`Lihat tiang jerami itu? Patahkan, dan seluruh gubuk roboh. Selalu cari titik lemahnya.`,l4:`Seorang pengintai di jembatan melihat kita. Bungkam dia sebelum membunyikan tanda bahaya.`,l5:`Angin mulai bertiup. Aku punya akal: Angin Reda menghentikan angin selama satu tembakan.`,l6:`Seperti rumah kartu: lantai dasarnya jerami. Hancurkan dasarnya, sisanya ikut runtuh.`,l7:`Tiga menara dihubungkan papan, dua pengintai di atasnya… tak akan lama lagi.`,l8:`Kincir ini setipis buluh. Dengan Kekuatan Titan, pelurumu lebih dari dua kali lebih berat.`,l9:`Pot-pot api Yunani milikku! Bidik jerami di bawah: api akan mengurus sisanya.`,l10:`Satu pagar runtuh? Aku masih punya seratus lagi. Benteng kayuku menunggumu, putri kecil.`,l11:`Ini batu besarku. Berat, sangat berat: simpan untuk batu, batu biasa cukup untuk kayu.`,l12:`Pengintai di puncak menaranya bisa melihat seluruh negeri. Turunkan dia.`,l13:`Tong mesiu di bawah menara batu… Satu percikan, dan duar. Bidik tongnya.`,l14:`Trebusetku siap! Ia menembak dari lebih jauh dan menghantam lebih keras. Satu klik menjatuhkan pemberat, klik kedua melepas ambin: semuanya soal waktu.`,l15:`Seorang ksatria berzirah, jauh di dalam menara. Semuanya harus runtuh menimpanya.`,l16:`Pot api habis? Tak masalah: kekuatan Api Yunani membakar bahkan batu biasa.`,l17:`Menara batu berdiri di atas jembatan kayu. Patahkan jembatannya, menaranya ikut: itulah batu kuncinya.`,l18:`Tong-tong di antara dua menara. Satu ledakan bisa mengguncang keduanya.`,l19:`Lorong kaca dan menara lonceng. Dengan Salvo, tiga peluru melesat menyebar.`,l20:`Benteng batuku punya dua menara, satu menara induk, dan delapan prajurit. Mainan kayumu tak berguna.`,l21:`Bubuk hitamku! Bom meledak saat mengenai sasaran dan menghancurkan besi. Bidik lantai besi.`,l22:`Ruang besi yang tersegel. Isian Mesiu membuat proyektil apa pun meledak.`,l23:`Mereka bertengger di bukit. Kau harus menembak melengkung, tinggi sekali.`,l24:`Seluruh benteng berdiri di atas tiga kaki kaca. Tiga. Rapuh. Paham maksudku?`,l25:`Enam rumah tersebar. Tembakkan peluru sebar, lalu sentuh layar saat melayang: ia terpecah tiga.`,l26:`Menara Babel: tujuh lantai, besi di jantungnya. Mordrac mengira menara ini tak terkalahkan.`,l27:`Saluran air di atas tiga pilar. Robohkan pilar tengah, dan seluruh jembatan jatuh.`,l28:`Sebuah aula tergantung di antara dua menara. Putus jembatannya, aulanya ikut jatuh.`,l29:`Biara itu kini jadi barak sang adipati. Menara loncengnya mengawasi seluruh lembah.`,l30:`Penguasa benteng ini bersembunyi di puncak menara. Cobalah meraihnya.`,l31:`Tanah bergetar? Itu Gempa: mengguncang seluruh kastel tanpa menembak.`,l32:`Benteng di atas batu karang. Hanya tembakan melengkung yang bisa melewatinya.`,l33:`Lantai keduanya jerami. Jerami di tengah batu… aneh sekali!`,l34:`Delapan lantai, besi di bawah. Percuma memukul dasarnya: robohkan dari atas.`,l35:`Ruang bawah tanah penuh tong di bawah aula besar. Temukan jalan masuknya, dan semuanya meledak.`,l36:`Empat menara, dua jembatan, dua ketinggian. Pilih urutan tembakanmu dengan cermat.`,l37:`Dua menara di atas lempeng, lempengnya di atas empat kaki kaca. Kau sudah tahu caranya.`,l38:`Benteng bertingkat: setiap menara menyembunyikan menara berikutnya. Tembak melengkung ke belakang.`,l39:`Ruang besi di bawah, kayu rapuh di atas. Labirin ini pandai menyembunyikan prajuritnya.`,l40:`Benteng agung: besi, tujuh lantai, dan penguasanya di puncak. Di sinilah perang kecilmu berakhir.`,l41:`Bata: lebih kuat dari kayu, lebih lemah dari batu. Batu besar yang bagus akan meruntuhkannya.`,l42:`Di atas tiang, di atas lumpur. Satu kaki jerami, dan semuanya tenggelam.`,l43:`Dusun rawa: rumah-rumah tersebar di dalam kabut. Peluru sebar akan jadi sahabatmu.`,l44:`Dua menara bata dan jembatannya. Para pengintai mengamati kita dari balik kabut.`,l45:`Gudang mesiu di antara alang-alang. Awasi tong-tongnya… dari jauh.`,l46:`Benteng bata yang panjang. Ada prajurit di setiap ruang, dan lebih banyak lagi di serambi.`,l47:`Menara berdempetan seperti domino. Yang pertama menjatuhkan semua yang lain.`,l48:`Rumah besar di atas air, berdiri di atas kaki kaca. Kaca tidak bisa berenang.`,l49:`Kincir agung: delapan lantai bata dan kayu. Ia menjulang di atas seluruh rawa.`,l50:`Benteng rawaku tidak mengapung: ia tenggelam… bersama kalian.`,l51:`Inilah gurun. Batu pasir lebih cepat rapuh daripada batu, tetapi tetap berat.`,l52:`Sebuah mesa: kastel di atas alas batu. Tembak melengkung, murid.`,l53:`Oasis: rumah-rumah tanah liat di sekitar sumur. Jangan kenai sumurnya, kita haus.`,l54:`Benteng pasir. Di bawah matahari ini, bahkan dindingnya tampak berkeringat.`,l55:`Karavanserai: deretan ruang di bawah serambi. Para tentara bayaran tidur di sana.`,l56:`Menara-menara angin. Di sini angin tak pernah reda: siapkan Angin Reda.`,l57:`Gudang mesiu sang sultan. Ia menjual mesiunya kepada Mordrac: mari kita kembalikan, sekaligus.`,l58:`Tangga raksasa dari menara-menara. Bidik yang paling belakang: setiap menara melindungi yang berikutnya.`,l59:`Mesa berbenteng. Mereka mengira tak terjangkau, bertengger di atas batu karangnya.`,l60:`Istana bukit pasirku akan menelan kalian, seperti pasir menelan orang ceroboh.`,l61:`Akhirnya, pegunungan. Sarang elang menempel di tebing. Apa pun yang bertengger bisa jatuh.`,l62:`Saluran air batu menjaga celah gunung. Pilar tengahnya menopang segalanya.`,l63:`Sembilan lantai! Pengintai itu pasti pusing. Turunkan dia lebih cepat dari rencananya.`,l64:`Tempat berlindung di atas tiang batu. Lebih kuat dari kaca, tetapi kaki tetaplah kaki.`,l65:`Tangga gunung: menara-menara yang makin tinggi, dan sang penguasa di puncaknya.`,l66:`Ruang bawah tanah biara: ruang berzirah di bawah ruang rapuh. Buka dari atas.`,l67:`Dua puncak, dua menara, dihubungkan jembatan di atas jurang.`,l68:`Jembatan di atas jurang. Jika jembatannya runtuh, semua ikut turun.`,l69:`Gudang mesiu tambang. Mordrac menyimpan mesiunya di sana: satu percikan cukup.`,l70:`Benteng puncak tak tertaklukkan. Aku memahatnya di gerbangnya.`,l71:`Es! Licin seperti sabun dan pecah seperti kaca. Apa pun bisa terjadi.`,l72:`Istana es di atas tiang. Megah… dan begitu rapuh.`,l73:`Prajurit sang adipati meringkuk di rumah-rumah bersalju. Api Yunani akan menghangatkan mereka.`,l74:`Domino beku. Satu dorongan, dan seluruh barisan meluncur.`,l75:`Si kembar beku: dua menara dan jembatan berlapis bunga es.`,l76:`Benteng musim dingin: bata, es, dan prajurit yang menggigil.`,l77:`Ruang bawah tanah di bawah es. Mulai dari atas: es pecah, besi tidak.`,l78:`Tangga beku sampai ke awan. Setiap anak tangga adalah menara.`,l79:`Gudang mesiu gletser. Mesiu dan es sangat cocok… untuk kita.`,l80:`Benteng esku tak akan pernah mencair. Kau, sebaliknya, akan membeku di tempat.`,l81:`Aku melihat badai dari menaraku… dan panji-panji kalian di tengah hujan. Semangat, anak-anakku.`,l82:`Saluran air bata di atas sungai deras. Bidik pilar tengahnya.`,l83:`Jembatan angkat dari besi di antara dua menara. Putus jembatannya.`,l84:`Ruang bawah tanah sang ksatria hitam: besi, tong, dan penjaga yang sangat pemarah.`,l85:`Domino besi. Berat untuk didorong… tetapi berat pula saat jatuh.`,l86:`Rumah besar yang tersambar petir, di atas tiang kaca. Petir sudah memulai pekerjaannya.`,l87:`Benteng agung: dinding terakhir sebelum ibu kota.`,l88:`Tangga besi dan bata. Di sini, bom lebih berguna daripada batu.`,l89:`Gudang mesiu di tengah badai. Satu bom ke tong-tongnya, dan badai mengurus sisanya.`,l90:`Menara badai. Semoga petir menyambarmu, kau dan katapelmu!`,l91:`Ibu kota. Menara marmer: batu terkeras di kerajaan.`,l92:`Galeri cermin. Bukan es, murid: cermin. Kaca, kau sudah tahu caranya.`,l93:`Menara kembar kerajaan. Ayahku sering membawaku ke sana waktu kecil; kini milik musuh.`,l94:`Perbendaharaan kerajaan: ruang besi di bawah aula marmer. Mordrac menyimpan emas sang raja di sana.`,l95:`Gazebo ini dulu tempatku menyendiri. Jangan sayangkan: ia berdiri di atas kaki kaca.`,l96:`Tangga kehormatan. Di puncaknya, ruang takhta sudah tak jauh lagi.`,l97:`Jembatan penobatan: di sinilah para raja dinobatkan. Putuskan, kita akan membangun yang baru.`,l98:`Gudang mesiu mahkota. Mendekat lagi, dan kuledakkan semuanya!`,l99:`Aku sudah dekat, di menara takhta. Saluran air kekaisaran adalah tembok terakhir di antara kita.`,l100:`Takhta ini milikku! Ambillah, kalau kau berani.`}},settings:{title:`Pengaturan`,sections:{display:`Tampilan`,accessibility:`Aksesibilitas`,sound:`Suara`,game:`Permainan`},language:`Bahasa`,theme:`Tema`,themes:{system:`Sistem`,light:`Terang`,dark:`Gelap`},contrast:`Kontras tinggi`,motion:`Animasi`,motions:{system:`Sistem`,reduced:`Dikurangi`,full:`Penuh`},uiScale:`Ukuran teks`,scales:{1:`Normal`,"1_15":`Besar`,"1_3":`Sangat besar`},startPower:`Kekuatan di awal giliran`,startPowers:{keep:`Tetap`,100:`100%`,75:`75%`,50:`50%`},tutorials:`Tutorial terpandu`,tutorialsDesc:`Bantuan langkah demi langkah saat sebuah alat pertama kali muncul.`,story:`Cerita antar level`,storyDesc:`Menampilkan Hikayat sebelum level yang membuka sebuah bab.`,trajectoryAid:`Bantuan lintasan`,trajectoryAidDesc:`Menampilkan kurva yang akan dilalui proyektil.`,slowSwing:`Ayunan lambat`,slowSwingDesc:`Jendela tembak trebuset berlangsung lebih lama sehingga saat melepas lebih mudah dipilih.`,infiniteSwing:`Ayunan tanpa henti`,infiniteSwingDesc:`Tanpa klik kedua, lengan trebuset kembali dan berayun lagi: luangkan waktu memilih tembakan. Kecuali di Sulit.`,captions:`Teks suara`,captionsDesc:`Menjelaskan setiap suara penting di layar, beserta arahnya.`,announcements:`Pengumuman suara`,announcementsDesc:`Memberi tahu pembaca layar apa yang terjadi dalam permainan.`,haptics:`Getaran`,hapticsDesc:`Pada perangkat yang mendukung.`,screenShake:`Guncangan layar`,blood:`Efek darah`,bloodDesc:`Noda darah singkat saat target tumbang. Nonaktif: kepulan debu.`,music:`Musik`,musicDesc:`Musik abad pertengahan yang memuncak di saat-saat seru. 0% untuk mematikannya.`,volume:`Volume`,mute:`Bisukan`,difficulty:`Kesulitan profil`,reset:`Atur ulang pengaturan`,on:`Aktif`,off:`Nonaktif`},help:{trebuchetTitle:`Trebuset`,trebuchet:`Terbuka setelah level 13 dan dipilih sebelum setiap level (kecuali mode berhadapan). Hanya dimainkan dengan klik: klik pertama menjatuhkan pemberat, klik kedua melepas ambin. Lepas awal untuk tembakan melengkung, lambat untuk tembakan datar. Menembak dari lebih jauh daripada katapel tetapi menghantam lebih keras (batu lebih berat), dan kamera mengikuti tembakan. Bunyi detak naik seiring sudut tembakan; opsi “Ayunan lambat” memperlambat lengan.`,modesTitle:`Mode permainan`,modes:`Kampanye: 100 level, dengan bintang dan emas. Main bebas: ulangi level yang sudah selesai tanpa batas. Dua pemain di perangkat yang sama: kampanye berdua secara kooperatif, duel (kemasyhuran), turnamen tiga babak, dan berhadapan (pembunuhan raja).`,workshopTitle:`Bengkel`,workshop:`Gunakan emas dari kampanye untuk meningkatkan katapel (kekuatan, peluru lebih berat, api, mesiu, amunisi, tembakan tambahan) atau mengubah tampilannya. Tingkat lanjutan juga memerlukan bintang.`,title:`Cara bermain`,goalTitle:`Tujuan`,goal:`Prajurit bersembunyi di setiap benteng. Atur sudut dan kekuatan ketapelmu untuk melumpuhkan mereka semua sebelum tembakanmu habis.`,aimTitle:`Membidik dan menembak`,aimTouch:`Layar sentuh atau mouse: tarik ke belakang seperti ketapel, lalu tekan “Tembak”.`,aimKeys:`Keyboard: ← → untuk sudut, ↑ ↓ untuk kekuatan (Shift agar lebih cepat), Spasi untuk menembak, 1 sampai 5 untuk amunisi, P untuk jeda.`,aidTitle:`Bantuan lintasan`,aid:`Aktifkan di pengaturan untuk melihat kurva tembakan. Angin ikut diperhitungkan.`,windTitle:`Angin`,wind:`Berubah setiap giliran dan membelokkan proyektil. Kekuatannya ditampilkan di bagian atas layar, dan kantong angin di dekat katapel juga menunjukkannya. Pada mode Sulit, angin jauh lebih kencang, makin kuat di ketinggian (tembakan melengkung lebih melenceng daripada tembakan datar) dan datang berembus: perhatikan garis angin yang lebih terang mendekat untuk memilih saat menembak. Proyektil berat seperti bongkahan lebih tahan angin, dan api menjalar searah angin.`,materialsTitle:`Material`,materials:`Dari yang paling rapuh ke paling kuat: kaca, jerami, es, kayu, batu pasir, bata, batu, marmer, besi. Para tokoh tumbang oleh benturan sekecil apa pun: dindinglah yang melindungi mereka. Batu biasa tidak cukup lagi melawan dinding batu: gunakan batu besar, bahan peledak, atau tingkatkan katapel di bengkel.`,powersTitle:`Kekuatan khusus`,powers:`Terbuka dengan menyelesaikan level. Satu per giliran, dan masing-masing mengurangi poin.`,scoreTitle:`Poin dan bintang`,score:`Setiap kehancuran memberi poin, lebih banyak lagi dalam reaksi berantai. Tembakan yang tidak terpakai bernilai 1.000 poin. Bintang bergantung pada jumlah tembakan: 3 bintang untuk satu tembakan (dua untuk kastel besar).`,achTitle:`Pencapaian`,ach:`Setiap level punya tiga pencapaian (menang tanpa peluru khusus, meledakkan semua tong, menjatuhkan raja lebih dulu…). Pencapaian terkumpul dari satu permainan ke permainan berikutnya dan memberi emas.`},modes:{title:`Mode lainnya`,hint:`Pengepungan tanpa akhir, bengkel, berdua`,chooseProfile:`Pilih profil`,duoDesc:`Di perangkat yang sama: kampanye berdua, duel, turnamen, dan berhadapan.`,duoOpen:`Main berdua`},endless:{title:`Pengepungan tanpa akhir`,desc:`Kastel demi kastel, makin lama makin sulit. Setiap kastel yang jatuh memberi tembakan; pengepungan berakhir saat sebuah kastel bertahan.`,start:`Mulai pengepungan`,locked:`Terbuka setelah {count} level kampanye`,record2:{one:`Rekor: {count} kastel, {score} poin`,other:`Rekor: {count} kastel, {score} poin`},rules:`Anda mulai dengan 6 tembakan. Setiap kastel yang jatuh memberi 3 lagi (4 jika jatuh dengan tembakan pertama), dan sisa tembakan dibawa ke kastel berikutnya.`,castle:`Kastel {n}`,shots:{one:`{count} tembakan untuk kastel ini`,other:`{count} tembakan untuk kastel ini`},castleDown:`Kastel {n} jatuh!`,bonus:{one:`+{count} tembakan`,other:`+{count} tembakan`},total:`Total pengepungan: {score} poin`,next:`Kastel {n}`,stop:`Hentikan pengepungan`,over:{zero:`Pengepungan berakhir di sini`,one:`Pengepungan selesai: {count} kastel jatuh`,other:`Pengepungan selesai: {count} kastel jatuh`},record:`Rekor baru!`,best:`Rekor Anda: {score} poin`,again:`Pengepungan baru`},editor:{title:`Bengkel kastel`,desc:`Bangun kastel Anda sepotong demi sepotong, taklukkan sendiri, lalu kirimkan ke teman.`,open:`Buka bengkel`,count:`Potongan: {parts}/{max} · penjaga: {targets}`,undo:`Batalkan`,settings:`Pengaturan`,test:`Uji`,share:`Bagikan`,clear:`Hapus semua`,verifyFirst:`Taklukkan dulu kastel Anda sendiri agar bisa membagikannya.`,canvasLabel:`Area bangunan. Ketuk untuk meletakkan potongan yang dipilih. Papan ketik: panah kiri dan kanan menggeser kursor, Enter meletakkan, Delete menghapus.`,partsLabel:`Potongan`,materialLabel:`Bahan`,parts:{room:`Lantai`,wall:`Dinding`,plank:`Balok`,base:`Fondasi`,roof:`Atap`,soldier:`Prajurit`,knight:`Ksatria`,king:`Raja`,barrel:`Tong`,erase:`Penghapus`},materials:{straw:`Jerami`,wood:`Kayu`,glass:`Kaca`,stone:`Batu`,iron:`Besi`,brick:`Bata`,sandstone:`Batu pasir`,ice:`Es`,marble:`Marmer`},placed:`{part} diletakkan.`,removed:`Potongan dihapus.`,cannot:`Tidak bisa di sini (terlalu tinggi, t
