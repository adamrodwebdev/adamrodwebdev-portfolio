# Déploiement Netlify : Netlify installe les dépendances (npm ci, d'après package-lock.json),
# puis la génération écrit le site dans dist/, seul dossier publié (1.9.0).
[build]
  publish = "dist"
  # Fichiers publiés, Vue et vue-i18n figés, gabarits précompilés, pages traduites, dist/_headers
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# En-têtes (sécurité, CSP, cache) : écrits par la génération dans dist/_headers (scripts/headers.mjs),
# car la CSP porte l'empreinte des scripts et styles en ligne, recalculée à chaque génération.

# Les démos ne sont plus hébergées ici (1.9.0) : les fiches mènent aux jeux sur Playgama.
# Redirections temporaires (302) tant que d'autres plateformes peuvent s'ajouter.
[[redirects]]
  from = "/demos/catapulte-mania/*"
  to = "https://playgama.ai/play/zifjwuawwwnzl2"
  status = 302
  force = true

[[redirects]]
  from = "/demos/ballmania/*"
  to = "/"
  status = 302
  force = true

# Lumirift (anciennement Stackrift) : sa démo laisse la place à la page du jeu.
[[redirects]]
  from = "/demos/lumirift/*"
  to = "/lumirift/"
  status = 301
  force = true

[[redirects]]
  from = "/demos/stackrift/*"
  to = "/lumirift/"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
