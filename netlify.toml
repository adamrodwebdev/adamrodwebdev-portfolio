# Déploiement Netlify : site statique, aucune compilation nécessaire.
[build]
  publish = "."
  # Régénère index.html et en/index.html à partir des traductions (aucune dépendance)
  command = "node scripts/build-pages.mjs"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Démo jouable de Catapulte Mania : non indexée (le jeu complet reste la page de référence)
[[headers]]
  for = "/demos/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "SAMEORIGIN"

# Fichiers de travail (template, scripts) : jamais servis aux visiteurs
[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
