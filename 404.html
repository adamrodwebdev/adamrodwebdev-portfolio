<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page introuvable | AdamRodWebDev</title>
  <meta name="description" content="Cette page n'existe pas ou a été déplacée.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem('arwd-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page { min-height: 100svh; display: grid; align-content: center; padding-block: 96px; }
    .page h1 { font-size: var(--step-3); text-transform: uppercase; margin-bottom: 20px; }
    .page h2 { font-size: var(--step-1); text-transform: uppercase; margin: 32px 0 8px; color: var(--gold); }
    .page p { color: var(--muted); max-width: 65ch; }
    .page .btn { margin-top: 32px; width: fit-content; }
    .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(6rem, 25vw, 14rem); line-height: .9; color: transparent; -webkit-text-stroke: 2px var(--gold); animation: glitch .6s steps(2) 3; }
  </style>
</head>
<body>
  <main class="container page">
    <p class="big" aria-hidden="true">404</p>
    <h1>Vous n'avez jamais demandé ça</h1>

</body>
</html>
